<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Calendar editor · YSA Boise Stake</title><link rel="stylesheet" href="css/admin.css"><script type="module" src="js/admin.js"></script></head><body><main>
<header><a href="calendar.html">View calendar</a><button id="logout" hidden>Sign out</button></header>
<h1>Calendar editor</h1><p id="identity">Sign in to manage your ward’s events.</p><p id="message" role="status" aria-live="polite"></p>
<form id="login"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form>
<section id="signedIn" hidden>
<details id="passwordPanel"><summary>Change password</summary><form id="password"><label>New password<input name="password" type="password" autocomplete="new-password" minlength="16" maxlength="128" required></label><label>Confirm password<input name="confirmation" type="password" autocomplete="new-password" required></label><button>Save password and sign out</button></form></details>
<section id="editor" hidden><h2 id="formTitle">Add event</h2><form id="eventForm"><input type="hidden" name="id"><label>Calendar<select name="calendarId" id="calendarSelect" required></select></label><label>Event<input name="title" maxlength="160" required></label><label>Date<input name="date" type="date" required></label><div class="row"><label>From<input name="startTime" type="time" required></label><label>Until<input name="endTime" type="time" required></label></div><p class="note">All times are Boise local time.</p><label>Place<input name="place" maxlength="300" required></label><label>Description<textarea name="description" maxlength="5000" rows="4"></textarea></label><div class="row"><button>Save event</button><button type="button" id="cancel">Clear</button></div></form><h2>Your events</h2><div id="eventList"></div></section>
<details id="accounts" hidden><summary>Ward accounts</summary><p>Set a temporary password of at least 16 characters. Give it privately to the ward editor; they must change it when signing in.</p><form id="accountForm"><label>Username<select name="username" id="accountSelect"></select></label><label>Temporary password<input name="password" type="password" autocomplete="new-password" minlength="16" maxlength="128" required></label><button>Set temporary password</button></form></details>
</section></main></body></html>
