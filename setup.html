<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Stake account setup</title><link rel="stylesheet" href="css/admin.css"><script type="module" src="js/setup.js"></script></head><body><main><h1>Set up the Stake account</h1><p>Enter the setup key saved in Cloudflare, then choose your Stake password. This works once.</p><form id="setup"><label>Setup key<input name="token" type="password" autocomplete="off" required></label><label>New Stake password<input name="password" type="password" autocomplete="new-password" minlength="16" maxlength="128" required></label><label>Confirm password<input name="confirmation" type="password" autocomplete="new-password" required></label><button>Create Stake password</button></form><p id="message" role="status"></p><a href="admin.html">Go to sign in</a></main></body></html>
