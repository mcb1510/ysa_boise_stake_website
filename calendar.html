<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f8f8f4" />
  <title>Stake Calendar</title>
  <style>
    :root { --ink:#18314c; --muted:#70849a; --line:#dce8f2; --paper:#f8fbfe; --forest:#0491c4; --sage:#e2f1fb; --sun:#f1b85d; --coral:#e27b68; --sky:#78b9dc; --plum:#a994c7; --blue:#658ad1; --pink:#dc91ac; }
    * { box-sizing:border-box } body { margin:0; color:var(--ink); font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", Avenir, system-ui, sans-serif; background:linear-gradient(145deg,#eaf5fb,#fbfdff 46%,#e7f2f8); min-height:100vh; }
    button { font:inherit; color:inherit; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .app { max-width:600px; margin:auto; min-height:100vh; background:rgba(251,253,255,.9); box-shadow:0 0 50px rgba(30,76,110,.08); padding:18px 16px 32px; }
    header { display:flex; justify-content:space-between; align-items:center; padding:6px 2px 20px; } .brand { display:flex;align-items:center;gap:10px;font-weight:800; font-size:18px; letter-spacing:-.4px; }.mark{height:34px;min-width:34px;padding:0 5px;display:grid;place-items:center;border-radius:11px;background:var(--forest);color:#fff;font-size:10px;font-weight:800;letter-spacing:-.35px}.profile{height:38px;width:38px;border-radius:50%;background:#dce8dc;color:var(--forest);font-weight:800}
    .controls { display:flex;justify-content:space-between;align-items:center;margin:8px 3px 13px; }.controls h2{font-size:22px; margin:0;letter-spacing:-.6px}.control-buttons{display:flex;gap:8px}.round{height:34px;width:34px;border-radius:50%;background:#e5f1f8;font-size:22px;line-height:1;display:grid;place-items:center}.round:active,.profile:active{transform:scale(.93)}
    .calendar { background:white;border:1px solid var(--line);border-radius:22px;padding:14px 10px 12px;box-shadow:0 5px 20px rgba(30,76,110,.04)}.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr)}.weekdays{margin-bottom:6px}.weekdays span{text-align:center;font-size:10px;font-weight:800;color:#8395a2;text-transform:uppercase}.day{position:relative;height:47px;background:transparent;border-radius:13px;display:flex;align-items:center;flex-direction:column;padding-top:5px;font-size:13px;font-weight:700}.day.empty{pointer-events:none}.day.selected{background:#e4f2fb;color:var(--forest);outline:1px solid #b9d9ea}.day.today .number{height:20px;width:20px;border-radius:50%;display:grid;place-items:center;background:var(--forest);color:#fff}.number{height:20px;z-index:1}.dots{height:9px;display:flex;gap:2px;margin-top:4px;max-width:32px;flex-wrap:wrap;justify-content:center}.dot{height:5px;width:5px;border-radius:50%}.more{font-size:8px;line-height:7px;color:#697b70;font-weight:900}
    .agenda-head{display:flex;justify-content:space-between;align-items:end;margin:26px 3px 12px}.agenda-head h2{font-size:21px;letter-spacing:-.7px;margin:0}.agenda-head span{font-size:12px;color:var(--muted);font-weight:700}.events{display:grid;gap:9px}.event{position:relative;display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 15px;min-height:76px;overflow:hidden;box-shadow:0 3px 14px rgba(30,60,45,.025)}.event:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}.time{width:64px;flex:0 0 64px;font-size:12px;font-weight:800;color:var(--muted);line-height:1.25}.event-main{min-width:0;flex:1}.event-main h3{font-size:14px;letter-spacing:-.25px;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;font-weight:650}.pill{background:color-mix(in srgb,var(--c) 15%,white);color:#405147;border-radius:99px;padding:3px 7px;font-size:10px;font-weight:800}.chevron{font-size:21px;color:#9ba69f;margin-left:4px}
    .filters{display:flex;gap:7px;overflow:auto;padding:2px 1px 13px;margin:14px 0 0;scrollbar-width:none}.filter{white-space:nowrap;border:1px solid var(--bubble-border,var(--line));background:var(--bubble,#fff);border-radius:99px;padding:8px 11px;font-size:11px;font-weight:500;color:var(--bubble-text,#53635b);transition:transform .16s,box-shadow .16s}.filter.active{box-shadow:inset 0 0 0 2px rgba(255,255,255,.85),0 0 0 2px var(--bubble-border,var(--forest));transform:translateY(-1px)}.filter[data-filter="all"]{--bubble:var(--forest);--bubble-border:var(--forest);--bubble-text:#fff}.filter[data-filter="today"]{--bubble:#6c8ead;--bubble-border:#6c8ead;--bubble-text:#fff}.filter[data-filter="Stake"]{--bubble:#f1b85d;--bubble-border:#f1b85d;--bubble-text:#fff}.filter[data-filter="River Valley"]{--bubble:#8a5a3b;--bubble-border:#8a5a3b;--bubble-text:#fff}.filter[data-filter="Overland"]{--bubble:#e27b68;--bubble-border:#e27b68;--bubble-text:#fff}.filter[data-filter="Owyhee"]{--bubble:#a994c7;--bubble-border:#a994c7;--bubble-text:#fff}.filter[data-filter="Table Rock"]{--bubble:#f06a1a;--bubble-border:#f06a1a;--bubble-text:#fff}.filter[data-filter="Eagle Island"]{--bubble:#0491c4;--bubble-border:#0491c4;--bubble-text:#fff}.filter[data-filter="North Linder"]{--bubble:#658ad1;--bubble-border:#658ad1;--bubble-text:#fff}
    .event{cursor:pointer}.event:focus-visible{outline:3px solid #8cc9e7;outline-offset:2px}.modal-backdrop{position:fixed;inset:0;z-index:20;background:rgba(19,45,67,.42);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s}.modal-backdrop.open{opacity:1;pointer-events:auto}.modal{width:min(100%,520px);background:#fff;border-radius:24px;padding:12px 20px 28px;box-shadow:0 12px 40px rgba(21,50,72,.24);transform:scale(.96);transition:transform .24s}.modal-backdrop.open .modal{transform:scale(1)}.grabber{width:38px;height:4px;border-radius:4px;background:#d6e1e8;margin:0 auto 17px}.modal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px}.modal h2{font-size:23px;letter-spacing:-.7px;line-height:1.08;margin:3px 0 0}.close{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:#eaf4fa;color:#41607a;font-size:25px;line-height:1}.details{margin:16px 0 0;display:grid;gap:13px}.detail{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:start}.detail dt{font-size:11px;font-weight:850;letter-spacing:.8px;text-transform:uppercase;color:#7a91a2;padding-top:2px}.detail dd{font-size:14px;line-height:1.35;font-weight:650;margin:0;color:#24435c}.event-label{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#4b6477}.event-label i{width:8px;height:8px;border-radius:50%;background:var(--event-color)}
    @media(min-width:601px){body{padding:25px 0}.app{border-radius:30px;min-height:880px}}
  </style>
</head>
<body><main class="app">
  <header><div class="brand"><span class="mark">YSA</span><span>YSA Boise Stake</span></div><button class="profile" aria-label="Profile">M</button></header>
  <section aria-label="Calendar"><div class="controls"><h2 id="monthTitle">November 2026</h2><div class="control-buttons"><button class="round" id="prev" aria-label="Previous month">‹</button><button class="round" id="next" aria-label="Next month">›</button></div></div><div class="calendar"><div class="weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div class="days" id="calendarDays"></div></div></section>
  <div class="filters" id="filters"><button class="filter active" data-filter="all">All calendars</button><button class="filter" id="todayBtn" data-filter="today">Today</button><button class="filter" data-filter="Stake">Stake</button><button class="filter" data-filter="River Valley">River Valley</button><button class="filter" data-filter="Overland">Overland</button><button class="filter" data-filter="Owyhee">Owyhee</button><button class="filter" data-filter="Table Rock">Table Rock</button><button class="filter" data-filter="Eagle Island">Eagle Island</button><button class="filter" data-filter="North Linder">North Linder</button></div>
  <section><div class="agenda-head"><h2 id="dateTitle">Saturday, November 14</h2><span id="count">3 events</span></div><div class="events" id="events"></div></section>
</main>
<div class="modal-backdrop" id="eventModal" aria-hidden="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="grabber"></div><div class="modal-top"><div><div class="event-label" id="modalWard"><i></i><span></span></div><h2 id="modalTitle">Event details</h2></div><button class="close" id="closeModal" aria-label="Close event details">×</button></div><dl class="details"><div class="detail"><dt>Event</dt><dd id="detailEvent"></dd></div><div class="detail"><dt>Date</dt><dd id="detailDate"></dd></div><div class="detail"><dt>Time</dt><dd id="detailTime"></dd></div><div class="detail"><dt>Place</dt><dd id="detailPlace"></dd></div><div class="detail"><dt>Description</dt><dd id="detailDescription"></dd></div></dl></section></div>
<script>
const events = [
 {d:2,time:'6:30 PM',ward:'Table Rock',title:'Ward family home evening',place:'Table Rock chapel',c:'#f06a1a'},
 {d:5,time:'7:00 PM',ward:'Stake',title:'Stake choir practice',place:'Stake center',c:'#f4bc54'},
 {d:7,time:'9:00 AM',ward:'Owyhee',title:'Community garden service',place:'Owyhee park',c:'#a887b8'},
 {d:8,time:'4:00 PM',ward:'River Valley',title:'Youth fireside',place:'River Valley chapel',c:'#8a5a3b'},
 {d:11,time:'6:00 PM',ward:'North Linder',title:'Relief Society activity',place:'North Linder chapel',c:'#658ad1'},
 {d:14,time:'9:00 AM',ward:'Stake',title:'Stake service project',place:'Food bank',c:'#f4bc54'},
 {d:14,time:'2:00 PM',ward:'Table Rock',title:'Baptism service',place:'Table Rock chapel',c:'#f06a1a'},
 {d:14,time:'6:30 PM',ward:'River Valley',title:'Fall family activity',place:'River Valley pavilion',c:'#8a5a3b'},
 {d:14,time:'7:00 PM',ward:'Overland',title:'Game night',place:'Overland chapel',c:'#e27b68'},
 {d:14,time:'7:15 PM',ward:'Owyhee',title:'Friendsgiving',place:'Owyhee chapel',c:'#a887b8'},
 {d:14,time:'7:30 PM',ward:'Eagle Island',title:'Ward social',place:'Eagle Island chapel',c:'#0491c4'},
 {d:14,time:'8:00 PM',ward:'North Linder',title:'Study group',place:'North Linder chapel',c:'#658ad1'},
 {d:18,time:'7:00 PM',ward:'Eagle Island',title:'Ward council',place:'Eagle Island chapel',c:'#0491c4'},
 {d:19,time:'6:30 PM',ward:'Stake',title:'Young adult social',place:'Stake center',c:'#f4bc54'},
 {d:21,time:'10:00 AM',ward:'River Valley',title:'Ward service day',place:'River Valley neighborhood',c:'#8a5a3b'},
 {d:24,time:'7:00 PM',ward:'Overland',title:'Thanksgiving pie night',place:'Overland chapel',c:'#e27b68'},
 {d:28,time:'5:30 PM',ward:'North Linder',title:'Friendsgiving dinner',place:'North Linder chapel',c:'#658ad1'}
];
let month=10,year=2026,selected=14,filter='all'; const colors=['#0491c4','#f06a1a','#f4bc54','#8a5a3b','#a887b8'];
function formatDate(day){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric'}).format(new Date(year,month,day));}
function render(){const name=new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric'}).format(new Date(year,month,1));document.getElementById('monthTitle').textContent=name;document.getElementById('dateTitle').textContent=formatDate(selected);const grid=document.getElementById('calendarDays');grid.innerHTML='';const first=new Date(year,month,1).getDay(),total=new Date(year,month+1,0).getDate();for(let i=0;i<first;i++)grid.insertAdjacentHTML('beforeend','<div class="day empty"></div>');for(let d=1;d<=total;d++){let matches=events.filter(e=>e.d===d);let shown=matches.slice(0,6);let dots=shown.map(e=>`<i class="dot" style="background:${e.c}"></i>`).join('');grid.insertAdjacentHTML('beforeend',`<button class="day ${d===selected?'selected':''} ${d===15?'today':''}" data-day="${d}" aria-label="${formatDate(d)}"><span class="number">${d}</span><span class="dots">${dots}</span></button>`)}document.querySelectorAll('.day[data-day]').forEach(b=>b.onclick=()=>{selected=+b.dataset.day;render()});let list=events.filter(e=>e.d===selected&&(filter==='all'||e.ward===filter));document.getElementById('count').textContent=`${list.length} ${list.length===1?'event':'events'}`;document.getElementById('events').innerHTML=list.length?list.map(e=>`<article class="event" tabindex="0" role="button" data-event="${events.indexOf(e)}" style="--c:${e.c}"><div class="time">${e.time}</div><div class="event-main"><h3>${e.title}</h3><div class="meta"><span class="pill">${e.ward}</span><span>${e.place}</span></div></div><span class="chevron">›</span></article>`).join(''):`<article class="event" style="--c:#cbd4cc"><div class="event-main"><h3>Nothing scheduled yet</h3><div class="meta">Choose another day or calendar.</div></div></article>`;document.querySelectorAll('[data-event]').forEach(card=>{card.onclick=()=>openModal(events[+card.dataset.event]);card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openModal(events[+card.dataset.event])}}})}
function timeRange(start){const [hour,minutePart]=start.split(':');const minute=minutePart.slice(0,2),ampm=minutePart.slice(3);let endHour=(+hour%12)+2;return `${start} – ${endHour}:${minute} ${ampm}`;}function openModal(e){document.getElementById('modalTitle').textContent=e.title;document.getElementById('detailEvent').textContent=e.title;document.getElementById('detailDate').textContent=formatDate(e.d);document.getElementById('detailTime').textContent=timeRange(e.time);document.getElementById('detailPlace').textContent=e.place;document.getElementById('detailDescription').textContent=`${e.ward} activity. Additional details, reminders, and contact information will appear here.`;const ward=document.getElementById('modalWard');ward.style.setProperty('--event-color',e.c);ward.querySelector('span').textContent=e.ward;const modal=document.getElementById('eventModal');modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.getElementById('closeModal').focus()}function closeModal(){const modal=document.getElementById('eventModal');modal.classList.remove('open');modal.setAttribute('aria-hidden','true')}document.getElementById('closeModal').onclick=closeModal;document.getElementById('eventModal').onclick=e=>{if(e.target.id==='eventModal')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.getElementById('prev').onclick=()=>{month--;if(month<0){month=11;year--}selected=1;render()};document.getElementById('next').onclick=()=>{month++;if(month>11){month=0;year++}selected=1;render()};document.getElementById('todayBtn').onclick=()=>{month=10;year=2026;selected=15;filter='all';document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.filter==='all'));render()};document.querySelectorAll('.filter').forEach(b=>{if(b.id!=='todayBtn')b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()}});render();
</script></body></html>
